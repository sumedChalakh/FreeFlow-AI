[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeflow_ai"
version = "0.1.0"
description = "Local‑first AI gateway backend"
requires-python = ">=3.12"
license = {text = "Provisional – license pending"}
readme = "README.md"
keywords = ["ai", "gateway", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi[all]>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.3.1",
    "structlog>=26.1.0",
]

[tool.uv]
package = true
